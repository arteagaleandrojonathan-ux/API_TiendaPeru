<!doctype html>

  <head>

    <style>
      * {
        padding: 0px;

      .contenedor {
        width: 90%;

      .tarjeta {

        display: inline-block;
        border-radius: 10px;
        margin-bottom: 0.25rem;
      }
      .tarjeta a {
        text-decoration: none;
        font-size: 12px;
      }
      .tarjeta a:hover {
        text-decoration: underline;
      }

      .tarjeta h5 {
        font-style: italic;
        margin-bottom: 0.25rem;
      }

      const contenedor = document.querySelector(".contenedor");
      const selector = document.getElementById("selector-carreras");

      //Evento ¿cuando ejecutamos la instruccion?
      selector.addEventListener("change", function () {
        RenderizarLasTarjetas(selector.value);
      });

      //continuemos
      //Manejo de DOM Documento objeto Model

      function RenderizarLasTarjetas(carrera = "") {
        let listaFiltrada = [];
        contenedor.innerHTML = "";

        const sumaring = [];

        if (carrera.trim() === "") {
          listaFiltrada = alumnos;
        } else {
          listaFiltrada = alumnos.filter((a) => a.carrera == carrera);
        }

        //Paso 1: Recorrer tood el arreglo
        listaFiltrada.forEach((alumno) => {
          const nuevaTarjeta = `
              <div class="tarjeta">
              <h4>${alumno.apellidos} ${alumno.nombres}</h4>
              <h5>${alumno.carrera}</h5>
              <a href="tel:${alumno.telefono}">Contactas</a>
              <a href="${alumno.correo}">Enviar correro</a>
            </div>
            `;
          contenedor.innerHTML += nuevaTarjeta;
        });
      }

      RenderizarLasTarjetas("Ingenieria de software");
    </script>
